<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз погоди</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-widget">
        
        <header class="widget-header">
            <h1 class="title-weekly">Прогноз погоди на тиждень</h1>
            <h2 class="title-today">Прогноз погоди на сьогодні</h2>
        </header>
        
       
        <div class="widget-content">
           
            <div class="week-grid" id="week-grid">
              
            </div>
            
           <h2 class="title-today-mob">Прогноз погоди на сьогодні</h2>
            <div class="today-details" id="today-details">
                
                <div class="loading">Завантаження погоди...</div>
            </div>
        </div>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
